services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: >-
      uvicorn Turning-Good-Agent.web.backend.dev:create_development_app
      --factory --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/Turning-Good-Agent
    volumes:
      - ./Turning-Good-Agent:/app/Turning-Good-Agent
      - sessions:/app/.sessions
      - ./settings.local.json:/app/settings.local.json

  frontend:
    image: node:22-alpine
    working_dir: /app/web/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_BACKEND_URL: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:8000:5173"
    volumes:
      - ./web/frontend:/app/web/frontend
      - frontend_node_modules:/app/web/frontend/node_modules
    depends_on:
      - backend

volumes:
  sessions:
  frontend_node_modules:
